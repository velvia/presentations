# Why Another Memory Profiler?

If your goal is debugging that prod memory issue, not many great choices:

1. `jemalloc` - provides a sampling profiler (good!), but VERY hard to use, difficult to get retained memory
2. `dhat` - nice project and UI, but very slow
3. `ByteHound` is a great project, great UI, but very slow and generates huge files

Many people end up instrumenting code, diffing total memory usage, or other ad-hoc methods.

---

# ying-profiler: a Sampling, Retained Memory Profiler

- **Sampling** - lightweight enough to use in production
- **Retained Memory** - crucial for leak detection, OOM troubleshooting
- **Easy to Use** - two lines and you get automatic FlameGraphs on memory changes
- No external tools needed to build flamegraphs at all!

# Ying is Super Easy to Use

I built this to make debugging OOMs and Memory Leaks _EASY_.

```rust
use ying_profiler::YingProfiler;

#[global_allocator]
static YING_ALLOC: YingProfiler = YingProfiler::default();

fn main() {
YING_ALLOC.start_profiling();
// ... the rest of your program
}
```

Default settings:
- Checks every 5 minutes
- Writes flamegraphs and reports retained memory IF retained memory has changed by >= 10%
- Designed to give you very succinct but useful reports

- Each report/flamegraph gives you ISO timestamp and retained memory size
- Filenames tell you the allocation story of the app
- Easily pick out the most interesting or peak flamegraph

# How does Ying Work?

- Ying implements `GlobalAlloc` - passing on the alloc call to default System allocator
- Only records a sample of new allocations
- free's and reallocs are checked against existing sampled allocations
- Sharded HashMap - `Arc<[RwLock<HashMap...>]>` - equiv of parking_lot but no allocations during lock

# Profiler Configuration

```rust
pub struct YingProfiler {
    /// Allocation sampling ratio. Eg: 500 means 1 in 500 allocations are sampled.
    sampling_ratio: u32,
    /// Prevent and dump stack trace for giant single allocations beyond a certain size
    single_alloc_limit: usize,
    ...
}
```

# Automatic Reporting Configuration

```rust
pub struct ProfilerRunner {
  /// Number of seconds in between memory checks
  #[builder(default = "DEFAULT_CHECK_INTERVAL_SECS")]
  check_interval_secs: usize,
  /// Percent change in retained memory to trigger a report
  #[builder(default = "DEFAULT_PCT_CHANGE_TRIGGER")]
  report_pct_change_trigger: usize,
  /// Path to write top retained memory reports to
  #[builder(default)]
  reporting_path: String,
  /// Expand inlined call stack symbols with a > ?
  #[builder(default = "false")]
  expand_frames: bool,
  /// Generate flamegraphs at reporting_path
  #[builder(default = "false")]
  gen_flamegraphs: bool,
}
```

# Writing a Memory Profiler: Don't Do It

- Do you like pain???   :)
- Implementing and testing custom GlobalAlloc is NOT for the sane
    - Must use `unsafe` :(
    - Cannot use data structures that allocate unless we protect against re-entrancy
    - We use an Atomic thread-local as a re-entrancy counter
    - Protect against all places where reentrancy could occur
- Standard lazy ThreadLocals are NOT safe - must use const thread locals
- Cannot use any data structure whose locking allocates
